[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dexter"
description = "Reusable application framework modules."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version"]
# `pydantic>=2.12` is a hard floor, not a preference: earlier releases have no cp314
# `pydantic-core` wheel and their sdist build fails on Python 3.14. `click` and `rich` are
# here for `dexter.cli`, and `fastapi` for `dexter.api`; each was a deliberate decision —
# see AGENTS.md. `fastapi>=0.115` is a hard floor too: pydantic models as query parameters
# (`Annotated[Model, Query()]`) arrived in 0.115.0, and `dexter.api` binds a whole request
# model from the query string with them.
dependencies = [
    "click>=8.4.2",
    "fastapi>=0.141.0",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
]
classifiers = ["Typing :: Typed"]

# `requires-python` above is the public compatibility floor and the ONLY hand-edited
# Python version literal in this repo. Ruff infers `target-version` from it and mypy
# follows the interpreter `uv run` selects, so neither tool repeats it.
# `.python-version` is a separate thing: the generated dev/CI interpreter pin, which
# may legitimately be newer than this floor. See AGENTS.md.

[project.urls]
Homepage = "https://github.com/fliklabs/dexter"

[tool.hatch.version]
path = "dexter/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["dexter"]
# Module-scoped agent guidance is for contributors, not consumers.
exclude = ["**/AGENTS.md"]

[tool.hatch.build.targets.sdist]
include = [
    "/dexter",
    "/tests",
    "/examples",
    "/tools",
    "/dx",
    "/verify.sh",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "tools" },
]
# `./dx serve` binds a port so the reference applications can be poked from a browser. It is
# the only thing in this repository that starts a server, and it lives here rather than in
# `[project.dependencies]` deliberately: `dexter.api` hands back an ASGI application and never
# runs one, so a consumer inherits no server from us.
tools = ["uvicorn>=0.52.0"]
test = [
    # `httpx` drives the ASGI app in-process, with no socket and no server. fastapi's own
    # `TestClient` is synchronous and runs the app on a portal thread, which would defeat the
    # per-task isolation `dexter.api` relies on.
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
lint = ["ruff>=0.16.0", "mypy>=2.3.0"]

# ─────────────────────────────── ruff ────────────────────────────────
[tool.ruff]
# `target-version` is deliberately omitted so it is inferred from
# project.requires-python. Never invoke ruff as `ruff --config <file>`: passing a
# config file explicitly disables that inference.
line-length = 88
required-version = ">=0.9"

[tool.ruff.lint]
# Deliberately NOT selected (see AGENTS.md before adding any of these):
#   FA  - FA102 auto-adds `from __future__ import annotations`, which turns every
#         annotation into a string and breaks runtime type introspection.
#   TC  - moves imports into `if TYPE_CHECKING:`; classes named in annotations that
#         are resolved at runtime must stay importable at runtime.
#   ANN - redundant with mypy strict's disallow_untyped_defs.
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "D",
    "UP",
    "S",
    "B",
    "A",
    "C4",
    "DTZ",
    "T20",
    "PT",
    "RET",
    "SIM",
    "ARG",
    "PTH",
    "ERA",
    "PL",
    "TRY",
    "PERF",
    "FURB",
    "PYI",
    "RUF",
]
ignore = [
    # The formatter owns these; ruff documents them as conflicting with it.
    "W191",
    "E111",
    "E114",
    "E117",
    "D206",
    "D300",
    # The formatter is only best-effort on line width.
    "E501",
    # Magic methods do not need docstrings.
    "D105",
    "TRY003",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["dexter"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "D", "PLR2004", "ARG"]
# The reference app's whole purpose is to print a readable transcript. Docstring rules stay
# on: an example is documentation, so it should be documented.
"examples/**/*.py" = ["T20"]
# The CLI's whole job is to write to a terminal, and its commands are documented by their
# docstrings the same way an example is.
"tools/**/*.py" = ["T20"]

[tool.ruff.format]
docstring-code-format = true

# ─────────────────────────────── mypy ────────────────────────────────
[tool.mypy]
# `python_version` is deliberately omitted so it follows the interpreter running
# mypy. Always invoke as `uv run mypy`; a global mypy or `uvx mypy` would silently
# check against a different Python version.
strict = true
warn_unreachable = true
# `examples` is checked at full strict, with no relaxing override: nothing executes the
# reference app, so type checking is its only protection against drifting out of step with
# the API — and if it passes under strict, consumers' code can too.
files = ["dexter", "tests", "examples", "tools"]
enable_error_code = ["redundant-expr", "possibly-undefined", "truthy-bool"]

# ───────────────────────────── coverage ──────────────────────────────
# The floor is enforced, not aspirational: `verify.sh` measures coverage and fails below it,
# so CI fails below it. 90 is high enough to mean something and low enough that the last
# unreachable branch of an error path does not hold up a change.
#
# A bare `uv run pytest` measures nothing, so running one module's tests stays fast and
# unguarded — only the full gate checks the floor.
[tool.coverage.run]
source = ["dexter"]
branch = false

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false

# ────────────────────────────── pytest ───────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]
# `async def` tests run without a per-test decorator. The fixture loop scope is set
# explicitly because leaving it unset can emit a deprecation warning, and every warning
# is fatal here.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
